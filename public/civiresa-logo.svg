<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <!-- Brand Color Definition -->
  <defs>
    <linearGradient id="civiOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f95700"/>
      <stop offset="100%" stop-color="#e04600"/>
    </linearGradient>
  </defs>

  <!-- Group for Logo Emblem -->
  <g fill="#ea580c" stroke="#ea580c" stroke-linejoin="round">
    
    <!-- Outer Triangle with Cutout for Open Book -->
    <!-- Apex and outer sides -->
    <path d="M 300 35 L 505 325 L 435 325 L 300 135 L 165 325 L 95 325 Z" fill="#ea580c" stroke="none"/>
    
    <!-- Inverted Triangle in Center -->
    <path d="M 235 155 L 365 155 L 300 255 Z" fill="none" stroke="#ea580c" stroke-width="26" stroke-linejoin="miter"/>
    
    <!-- Center Dot / Eye of Knowledge -->
    <circle cx="300" cy="190" r="16" fill="#ea580c" stroke="none"/>

    <!-- Open Book Pages (Bottom base of triangle) -->
    <!-- Upper Left Page -->
    <path d="M 170 235 C 220 230, 270 260, 298 290 C 265 272, 215 252, 160 252 Z" fill="#ea580c" stroke="none"/>
    <!-- Upper Right Page -->
    <path d="M 430 235 C 380 230, 330 260, 302 290 C 335 272, 385 252, 440 252 Z" fill="#ea580c" stroke="none"/>

    <!-- Main Left Book Wings -->
    <path d="M 295 305 C 240 270, 170 260, 115 278 C 170 278, 235 292, 290 325 Z" fill="#ea580c" stroke="none"/>
    <!-- Main Right Book Wings -->
    <path d="M 305 305 C 360 270, 430 260, 485 278 C 430 278, 365 292, 310 325 Z" fill="#ea580c" stroke="none"/>

    <!-- Lower Left Page Layer -->
    <path d="M 293 328 C 235 300, 165 296, 92 322 C 150 310, 225 318, 290 342 Z" fill="#ea580c" stroke="none"/>
    <!-- Lower Right Page Layer -->
    <path d="M 307 328 C 365 300, 435 296, 508 322 C 450 310, 375 318, 310 342 Z" fill="#ea580c" stroke="none"/>
  </g>

  <!-- Typography: CiViRESA -->
  <text x="300" y="430" 
        text-anchor="middle" 
        font-family="'Times New Roman', 'Playfair Display', 'Cinzel', serif" 
        font-weight="900" 
        font-size="82" 
        letter-spacing="1" 
        fill="#ea580c">
    CiViRESA
  </text>

  <!-- Institute Separators and Text -->
  <line x1="70" y1="472" x2="195" y2="472" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round"/>
  <text x="300" y="482" 
        text-anchor="middle" 
        font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" 
        font-weight="800" 
        font-size="34" 
        letter-spacing="12" 
        fill="#ea580c">
    INSTITUTE
  </text>
  <line x1="405" y1="472" x2="530" y2="472" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Subtitle Tagline with Course Offerings -->
  <text x="300" y="525" 
        text-anchor="middle" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-weight="800" 
        font-size="16.5" 
        letter-spacing="0.5" 
        fill="#ea580c">
    UPSC  |  STATE PCS  |  NEET  |  JEE (ADVANCE &amp; MAINS)  |  TUITIONS
  </text>
</svg>
